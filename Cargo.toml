[package]
name = "ward"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/milchinskiy/ward"
license = "MIT OR Apache-2.0"
authors = ["Alexander Milchinskiy <milchinskiy@gmail.com>", "Ward contributors"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
redundant_pub_crate = "warn"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = [
  "clock",
  "std",
] }
configparser = "3.1.0"
filetime = "0.2.26"
futures-util = { version = "0.3.31", default-features = false, features = [
  "alloc",
] }
hostname = "0.4.2"
mlua = { version = "0.11.5", features = [
  "lua54",
  "vendored",
  "serialize",
  "serde",
  "async",
  "send",
  "error-send",
] }
nix = { version = "0.30.1", default-features = false, features = [
  "fs",
  "signal",
  "user",
] }
rand = { version = "0.9.2", features = ["small_rng"] }
regex = "1.12.2"
rust-args-parser = "1"
rustlog = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", default-features = false, features = [
  "std",
] }
serde_yaml = "0.9.34"
sysinfo = "0.37.2"
tokio = { version = "1.48.0", features = ["full"] }
toml = { version = "0.9.8", default-features = false, features = [
  "display",
  "parse",
  "serde",
] }
glob = "0.3.1"
reqwest = { version = "0.12.9", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
  "http2",
  "stream",
] }
minijinja = { version = "2.3.1", default-features = false, features = [
  "builtins",
  "serde",
  "loader",
  "urlencode",
] }
rpassword = "7.4.0"
serde_ext_duration = "0.2.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
md5 = "0.8.0"
hex = "0.4.3"
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = "3.13.0"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
opt-level = "z"
panic = "abort"
debug = 0
incremental = false
